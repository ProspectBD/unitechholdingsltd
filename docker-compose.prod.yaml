
backend:
  build:
    context: ./backend
    dockerfile: ./docker/production/nginx/Dockerfile
  volumes:
    - laravel-storage-production:/var/www/storage
    - laravel-public-assets:/var/www/public/build
  networks:
    - laravel-production
  ports:
    - "8891:80"
  depends_on:
    php-fpm:
      condition: service_healthy
  restart: unless-stopped

php-fpm:
  build:
    context: ./backend
    dockerfile: ./docker/common/php-fpm/Dockerfile
    target: production
  volumes:
    - laravel-public-assets:/var/www/public/build
    - laravel-storage-production:/var/www/storage
  env_file:
    - .env
  networks:
    - laravel-production
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test:
      - CMD-SHELL
      - php -r '$$s=@fsockopen("127.0.0.1",9000); exit($$s ? 0 : 1);'
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 60s
  restart: unless-stopped

db:
  image: mariadb:10.5.7
  environment:
    MYSQL_ROOT_PASSWORD: app
    MYSQL_DATABASE: unitech_db
    MYSQL_USER: root
    MYSQL_PASSWORD: app
  networks:
    - laravel-production
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-papp"]
    interval: 10s
    timeout: 20s
    retries: 10
    start_period: 30s
  restart: unless-stopped

volumes: 
  laravel-storage-production:
  laravel-public-assets:
networks:
  laravel-production: 
        driver: bridge
   
